
<div id="sermons" class="full-page pad-content" 
                     style="background-color: transparent;color:black;height:150vh;">
    <div class="background-image-church-family page-layout">
        <div class="link-box">
            <a href="" class="text-outline-white link-button outlined-text-brown" style="color:brown">Main Page</a>
            <a href="../#/what-we-believe" class="text-outline-white link-button outlined-text-brown;" style="color:brown">What We Believe</a>
            <a href="../#/join-with-us" class="text-outline-white link-button outlined-text-brown;" style="color:brown">Join With Us</a>
        </div>
        <div class="text-outline-brown title-grid-layout">
            <div style="display:flex;flex-direction: column;grid-column:5/span 15;grid-row:1/span 10;">
                <div style="border:transparent 2px solid;width:100%;font-size:5.0em;">Sunday Sermons</div>
            </div>
        </div>
        <div class="text-outline-brown">
            <div class="bubble-dark ">
                <div class="white-subheader" style="background-color:transparent">Sermons from Recent Services</div>   
                <div style="align-content:center;background-color: transparent;display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;">
                <div *ngFor="let sermon of sermons">
                    <sermon-player style="width:60%;margin: 0 25%;min-width:200px;min-height:150px;" [videoID]="sermon.videoID"></sermon-player>
                    <div class="white-subheader">{{sermon.date}}&mdash;{{sermon.name}}</div>
                    <hr>
                </div>
                </div>
            </div>
        </div>
    </div>
</div>
